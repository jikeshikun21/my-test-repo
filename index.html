<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub × Netlify 連携テスト</title>
<style>
  body { font-family: "Hiragino Sans", "Yu Gothic", sans-serif; background:#f4f6f9; color:#1f2933; margin:0; padding:40px 20px; }
  .card { max-width:640px; margin:0 auto; background:#fff; border-radius:12px; padding:32px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
  h1 { font-size:22px; margin:0 0 8px; }
  p { line-height:1.8; }
  .ok { display:inline-block; background:#e3f6ea; color:#1d7a45; padding:4px 12px; border-radius:999px; font-size:14px; }
  small { color:#6b7785; }
</style>
</head>
<body>
  <div class="card">
    <span class="ok">✔ 連携テスト成功</span>
    <h1>GitHub × Netlify 連携テストページ</h1>
    <p>このページはClaudeがGitHubのリポジトリに保存したものです。<br>
    Netlifyと連携すると、GitHubに変更を保存するたびにこのページが自動で更新されます。</p>
    <p><small>更新日時：<span id="d"></span>（ページを開いた時刻）</small></p>
  </div>
<script>document.getElementById('d').textContent = new Date().toLocaleString('ja-JP');</script>
</body>
</html>
